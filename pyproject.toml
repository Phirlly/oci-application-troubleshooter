[project]
name = "oci-application-troubleshooter"
version = "0.0.0"
description = "Deployment policy for the OCI application troubleshooting demo"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "oci==2.187.2",
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "argon2-cffi==25.1.0",
]

[dependency-groups]
dev = ["coverage==7.16.2", "httpx2==2.13.1"]

[tool.uv]
package = false

[tool.coverage.run]
branch = true
source = ["troubleshooter_deployment", "troubleshooter_app"]
data_file = ".cache/coverage/.coverage"

[tool.coverage.report]
show_missing = true
