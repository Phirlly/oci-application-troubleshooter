{
  "name": "Resolve frontend lock (development only)",
  "on": {
    "push": {
      "branches": [
        "dev"
      ],
      "paths": [
        ".github/workflows/frontend-lock.yml",
        "frontend/package.json",
        "tests/contract/test_frontend_lock_workflow.py"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "frontend-lock-dev",
    "cancel-in-progress": true
  },
  "jobs": {
    "resolve": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "if": "${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}",
      "steps": [
        {
          "name": "Checkout exact development commit",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "name": "Require initial lock acquisition",
          "run": "test ! -e frontend/package-lock.json"
        },
        {
          "name": "Resolve public npm lock without lifecycle scripts",
          "run": "podman run --rm --timeout 300 --userns keep-id --user \"$(id -u):$(id -g)\" --read-only --tmpfs /tmp:rw,noexec,nosuid,size=1g --cap-drop ALL --security-opt no-new-privileges --volume \"$GITHUB_WORKSPACE/frontend:/frontend:rw\" --workdir /frontend --env HOME=/tmp --env NPM_CONFIG_USERCONFIG=/dev/null --env NPM_CONFIG_CACHE=/tmp/npm docker.io/library/node@sha256:51b1100cc2a83d370c6a60952e3f2989c8a43159d0e38586e090f3b3326efefd npm install --no-audit --no-fund --package-lock-only --ignore-scripts --registry=https://registry.npmjs.org --fetch-retries=1 --fetch-timeout=20000"
        },
        {
          "name": "Audit resolved dependency graph",
          "run": "podman run --rm --timeout 60 --userns keep-id --user \"$(id -u):$(id -g)\" --read-only --tmpfs /tmp:rw,noexec,nosuid,size=1g --cap-drop ALL --security-opt no-new-privileges --volume \"$GITHUB_WORKSPACE/frontend:/frontend:ro\" --workdir /frontend --env HOME=/tmp --env NPM_CONFIG_USERCONFIG=/dev/null --env NPM_CONFIG_CACHE=/tmp/npm docker.io/library/node@sha256:51b1100cc2a83d370c6a60952e3f2989c8a43159d0e38586e090f3b3326efefd npm audit --audit-level=low --package-lock-only --ignore-scripts --registry=https://registry.npmjs.org --fetch-retries=1 --fetch-timeout=20000"
        },
        {
          "name": "Save only the public dependency lock",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "frontend-lock",
            "path": "frontend/package-lock.json",
            "retention-days": 1,
            "if-no-files-found": "error",
            "include-hidden-files": false
          }
        }
      ]
    }
  }
}
